[project]
name = "trajfoundry"
version = "0.1.0"
description = "Normalize supported capture formats into auditable training trajectories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0,<2.0.0",
  "orjson>=3.10.0",
  "pydantic>=2.9.0",
  "typer>=0.15.0",
]

[project.scripts]
trajfoundry = "trajfoundry.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajfoundry"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
